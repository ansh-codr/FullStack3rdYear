<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button:hover{
            background-color: rgb(54, 208, 46);
            color: rgb(226, 233, 12);
        }
        button:active{
            background-color: rgb(47, 177, 187);
            color: rgb(157, 125, 26);
            border-radius: 70px;

        }
        button:focus{
            background-color: gray;
            box-shadow: 3px 3px 5px red;
        }
        a:visited{
            color: paleturquoise;
        }
        a:hover{
            color: darkolivegreen;
        }
    </style>
</head>
<body>
    <button>Click Me!</button>
    <a href="#link">Link</a>
</body>
</html>

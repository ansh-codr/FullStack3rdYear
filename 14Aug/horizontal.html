<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shoes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            display: flex;
            overflow-x: auto;
        }

        .box {
            min-width: 100vw;
            height: 100vh;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
            
        }

        #box1 {
            background-image: url("https://images.pexels.com/photos/15475641/pexels-photo-15475641.jpeg");
        }

        #box2 {
            background-image: url("https://images.pexels.com/photos/8473534/pexels-photo-8473534.jpeg");
        }

        #box3 {
            background-image: url("https://images.pexels.com/photos/11324547/pexels-photo-11324547.jpeg");
        }

        #box4 {
            background-image: url("https://images.pexels.com/photos/4695175/pexels-photo-4695175.jpeg");
        }

        #box5 {
            background-image: url("https://images.pexels.com/photos/14337851/pexels-photo-14337851.jpeg");
        }

        p {
            font-size: 50px;
            font-family: Arial, sans-serif;
            color: white;
            font-weight: bold;

            text-shadow: 2px 2px 8px black;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box" id="box1">
            <p>SHOES 1</p>
        </div>

        <div class="box" id="box2">
            <p>SHOES 2</p>
        </div>

        <div class="box" id="box3">
            <p>SHOES 3</p>
        </div>

        <div class="box" id="box4">
            <p>SHOES 4</p>
        </div>

        <div class="box" id="box5">
            <p>SHOES 5</p>
        </div>

    </div>
</body>

</html>

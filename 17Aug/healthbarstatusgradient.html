<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cont {
            width: 220px;
            margin: 0 auto;
            text-align: center;
        }

        .box1 {
            width: 100%;
            height: 18px;
            border-radius: 20px;
            background: linear-gradient(to right, red 0%, yellow 50%, green 100%);
            border: 2px solid #000;
            box-sizing: border-box;
        }
        p{
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="cont">
        <p>Health Level</p>
        <div class="box1"></div>
        <p>Health scale</p>
    </div>
</body>

</html>

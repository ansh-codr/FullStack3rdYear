<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cir {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: conic-gradient(#00d9ff 0 75%, #2a2a2a 75% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .inner {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="cir">
        <div class="inner">75%</div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
        :enabled
        :disabled
        :valid
        :invalid
        :required
        :optional
        :in-range
        :out-of-range
        :read-only
        :read-write
        :placeholder-shown
        :checked
        */

        input{
            margin: 3px;
            border-width: 0 0 2px 0;
            border-color: rgb(8, 144, 235);
            border-style: solid;

        }
        input:required{
            font-family: Arial;
        }
        input:optional{
            font-family: Montana;
        }
        input:valid{
            color: green;
        }
        input:invalid{
            color: red;
        }
        input:in-range{
            font-weight: 900;
        }
        input:read-only{
            background-color: transparent;
            border-width: 0px;
        }
        input:read-write{
            box-shadow: 3px 3px 0 black;
        }

    </style>
</head>
<body>
    
    <form>
        <input type="text" name="name" placeholder="First Name">
        <br><br>
        <input type="text" name="mname" placeholder="Middle Name">
        <br><br>
        <input type="text" name="lname" placeholder="Last Name">
        <br><br>
        <input type="email" name="email" placeholder="Email">
        <br><br>
        <input type="checkbox" name="" id="">
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box2 {
            background-color: beige;
            margin: 10px;
        }

        #box1,
        #box3 {
            width: auto;
            height: auto;
            margin: 10px;
            background-color: grey;
            display: flex;
        }

        #box1:hover,
        #box2:hover,
        #box3:hover {
            /* background-color: red; */
            box-shadow: 3px 3px 5px red;
        }

        p:hover {
            color: blue;
        }

        #focus_practice1,
        #focus_practice2,
        #focus_practice3:hover {
            background-color: black;
        }

        #focus_practice1:focus {
            background-color: rgb(58, 162, 231);
        }

        #focus_practice2:focus {
            background-color: rgb(35, 202, 82);
        }

        #focus_practice3:focus {
            background-color: rgb(193, 209, 12);
        }

        #focus_practice1,
        #focus_practice2,
        #focus_practice3 {
            background-color: black;
            color: white;
        }
        button{
            margin: 20px;
        }
        #active_practice1:focus{
            background-color: rgb(104, 23, 181);
            outline-width: 2px;
            outline-color: rgb(156, 196, 25);
        }
        #active_practice1:active{
            box-shadow: 0 0 0 transparent;
            background-color: rgb(190, 17, 109);
        }
    </style>
</head>

<body>
    <div id="box1">
        <p>Hello Developer! My name is Ereborne. Are you there?, i have some work for you </p>
    </div>
    <div id="box2">Hey Nice to meet you. i'm here tell what you want</div>
    <div id="box3">Nothing i just checking that you there or not , in terms of works i have a little work for you.</div>


    <button id="focus_practice1">hey buddy</button>
    <button id="focus_practice2">hey buddy</button>
    <button id="focus_practice3">hey buddy</button>


    <button id="active_practice1">hello</button>

</body>

</html>

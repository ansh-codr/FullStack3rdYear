<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: -webkit-fill-available;
        }
        p{
            font-size: 30px;
            text-align: center;
            color: white;
        }
        .box {
            width: 100%;
            height: 150px;
        }

        #box1 {
            background-color: rgb(237, 19, 219);
            position: sticky;
            top: 30px;

        }

        #box2 {
            background-color: black;
            position: fixed;

        }

        #box3 {
            background-color: rgb(51, 84, 192);
            position: fixed;

        }

        #box4 {
            background-color: rgb(156, 22, 22);
            position: sticky;
        }

        #box5 {
            background-color: rgb(37, 137, 139);
            position: sticky;

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box" id="box1">
            <p>1</p>
        </div>
        <div class="box" id="box2">
                        <p>1</p>

        </div>
        <div class="box" id="box3">
                        <p>1</p>

        </div>
        <div class="box" id="box4">
                        <p>1</p>

        </div>
        <div class="box" id="box5">
                        <p>1</p>

        </div>
    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        #container{
            width: 500px;
            height: 500px;
            position: relative;
            overflow: hidden;
        }
        #img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #glass{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, 50%);
            padding: 30px;
            width: 250px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div id="container">
        <img id="img" src="test1.jpg" alt="Background image">
        <div id="glass">
            <h2>Glass Effect</h2>
            <p>This is a glassmorphism card overlay.</p>
        </div>
    </div>
</body>
</html>
